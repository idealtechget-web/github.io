<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IdealTech ⎯ Agendar Visita Técnica</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0a0f1d; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .form-container { background: rgba(20, 29, 45, 0.8); padding: 30px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); width: 100%; max-width: 480px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { margin-top: 0; color: #3b82f6; font-size: 1.5rem; text-align: center; }
        p { color: #94a3b8; font-size: 0.85rem; text-align: center; margin-bottom: 25px; }
        
        .row { display: flex; gap: 15px; }
        .col { flex: 1; }
        
        label { display: block; margin-top: 15px; font-size: 0.85rem; color: #cbd5e1; font-weight: 600; }
        input, select, textarea { width: 100%; padding: 12px; margin-top: 5px; border-radius: 6px; border: 1px solid #28374d; background: #0d1524; color: #fff; box-sizing: border-box; font-family: 'Inter', sans-serif; font-size: 0.9rem; }
        input:focus, select:focus, textarea:focus { border-color: #3b82f6; outline: none; }
        
        .note { color: #94a3b8; font-size: 0.75rem; margin-top: 4px; display: block; font-style: italic; }
        
        button { margin-top: 25px; width: 100%; background: #3b82f6; color: #fff; border: none; padding: 14px; border-radius: 6px; font-weight: 800; font-size: 1rem; cursor: pointer; transition: 0.3s; }
        button:hover { background: #2563eb; }
        
        @media (max-width: 480px) {
            .row { flex-direction: column; gap: 0; }
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Visita Técnica</h2>
        <p>Preencha os dados abaixo para solicitar seu atendimento presencial.</p>
        
        <div class="row">
            <div class="col">
                <label for="nome">Nome do Contato</label>
                <input type="text" id="nome" placeholder="Seu nome" required>
            </div>
            <div class="col">
                <label for="telefone">WhatsApp (com DDD)</label>
                <input type="text" id="telefone" placeholder="(00) 00000-0000" maxlength="15" required>
            </div>
        </div>

        <label for="endereco">Endereço Completo</label>
        <input type="text" id="endereco" placeholder="Rua, Número, Bairro, Ponto de Referência" required>

        <div class="row">
            <div class="col">
                <label for="equipamento">Equipamento / Sistema</label>
                <select id="equipamento" required>
                    <option value="" disabled selected>Selecione...</option>
                    <option value="Computador / Notebook">Computador / Notebook</option>
                    <option value="Impressora">Impressora</option>
                    <option value="Rede / Internet">Rede / Wi-Fi</option>
                    <option value="Sistema IdealTech">Sistema IdealTech</option>
                    <option value="Outros">Outros</option>
                </select>
            </div>
            <div class="col">
                <label for="horario">Disponibilidade a partir de:</label>
                <select id="horario" required>
                    <option value="" disabled selected>Escolha sua disponibilidade...</option>
                    <optgroup label="Segunda a Sexta">
                        <option value="Dias Úteis - Após as 18:00">Após as 18:00</option>
                        <option value="Dias Úteis - Após as 19:00">Após as 19:00</option>
                        <option value="Dias Úteis - Após as 20:00">Após as 20:00</option>
                    </optgroup>
                    <optgroup label="Sábados">
                        <option value="Sábado - Período da Manhã">Período da Manhã</option>
                        <option value="Sábado - Período da Tarde">Período da Tarde</option>
                    </optgroup>
                    <option value="A combinar pelo WhatsApp">A combinar (Sem horário fixo)</option>
                </select>
                <span class="note">* Visitas de Seg a Sex ocorrem após as 18h.</span>
            </div>
        </div>

        <label for="descricao">Descrição do Problema</label>
        <textarea id="descricao" rows="3" placeholder="Detalhe o que está acontecendo para agilizarmos o diagnóstico..." required></textarea>

        <button onclick="enviarParaWhatsApp()">Abrir Chamado via WhatsApp</button>
    </div>

    <script>
        // Aplica a máscara de telefone dinamicamente
        document.getElementById('telefone').addEventListener('input', function (e) {
            let x = e.target.value.replace(/\D/g, '').match(/(\d{0,2})(\d{0,5})(\d{0,4})/);
            e.target.value = !x[2] ? x[1] : '(' + x[1] + ') ' + x[2] + (x[3] ? '-' + x[3] : '');
        });

        // Função de disparo
        function enviarParaWhatsApp() {
            const nome = document.getElementById('nome').value.trim();
            const telefone = document.getElementById('telefone').value.trim();
            const endereco = document.getElementById('endereco').value.trim();
            const equipamento = document.getElementById('equipamento').value;
            const horario = document.getElementById('horario').value;
            const descricao = document.getElementById('descricao').value.trim();

            if(!nome || !telefone || !endereco || !equipamento || !horario || !descricao) {
                alert("Por favor, preencha todos os campos para agendarmos sua visita.");
                return;
            }

            const mensagem = `🚨 *SOLICITAÇÃO DE VISITA TÉCNICA* 🚨\n\n*Cliente:* ${nome}\n*WhatsApp:* ${telefone}\n*Endereço:* ${endereco}\n*Equipamento:* ${equipamento}\n*Disponível a partir de:* ${horario}\n*Problema:* ${descricao}`;
            const textoCodificado = encodeURIComponent(mensagem);
            
            // Seu número oficial da operação técnica
            const numeroDestino = "5548998273891"; 
            
            const urlWhatsApp = `https://wa.me/${numeroDestino}?text=${textoCodificado}`;
            window.open(urlWhatsApp, '_blank');
            
            // Fecha a aba após 500 milissegundos
            setTimeout(function() {
                window.close();
            }, 500);
        }
    </script>
</body>
</html>
